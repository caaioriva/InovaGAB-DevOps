spring:
  application:
    name: inovagab-backend

  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017}
    database: ${MONGODB_DATABASE:inovagab}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:chave-local-apenas-desenvolvimento-1234567890}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
