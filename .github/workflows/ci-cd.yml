name: CI/CD - InovaGAB

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  build-test:
    name: Build, testes e Docker
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DATABASE: inovagab_ci
      JWT_SECRET: chave-ci-segura-com-mais-de-32-caracteres-123456789
      GEMINI_API_KEY: ""
      GEMINI_MODEL: gemini-2.5-flash
      PORT: 8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes automatizados
        run: ./mvnw -B clean test

      - name: Gerar artefato da aplicação
        run: ./mvnw -B -DskipTests package

      - name: Validar build da imagem Docker
        run: docker build -t inovagab-backend:${{ github.sha }} .

  deploy-staging:
    name: Deploy - Staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build-test
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Disparar deploy do Render - Staging
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
        run: curl -fsS -X POST "$DEPLOY_HOOK"

      - name: Validar ambiente de Staging
        env:
          APP_URL: ${{ secrets.STAGING_URL }}
        run: |
          for tentativa in {1..18}; do
            if curl -fsS "$APP_URL/health"; then
              echo "Staging disponível."
              exit 0
            fi
            echo "Aguardando staging... tentativa $tentativa/18"
            sleep 10
          done
          echo "Staging não respondeu ao health check."
          exit 1

  deploy-production:
    name: Deploy - Produção
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Disparar deploy do Render - Produção
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}
        run: curl -fsS -X POST "$DEPLOY_HOOK"

      - name: Validar ambiente de Produção
        env:
          APP_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          for tentativa in {1..18}; do
            if curl -fsS "$APP_URL/health"; then
              echo "Produção disponível."
              exit 0
            fi
            echo "Aguardando produção... tentativa $tentativa/18"
            sleep 10
          done
          echo "Produção não respondeu ao health check."
          exit 1
